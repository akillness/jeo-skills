<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">From skill catalog to host</title>
  <desc id="desc">Browse the catalog, preview a selection with jeo-skill, install it through npx skills into selected host roots, and verify with doctor and host discovery. The guided setup is a separate path that defaults to the full catalog. OpenSpace, Jev, and Jevgrep are independently optional and require their own setup. Installing files does not activate a host or authorize providers.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #EDF6FF; }
      .heading { font-size: 27px; font-weight: 700; }
      .label { font-size: 22px; font-weight: 700; }
      .body { font-size: 19px; fill: #C8D6EE; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 19px; }
      .card { fill: #131C39; stroke: #36476F; stroke-width: 2; }
      .line { fill: none; stroke: #65E5F5; stroke-width: 2.5; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#65E5F5"/></marker>
  </defs>
  <rect width="1200" height="570" fill="#090F25"/>
  <circle cx="1116" cy="54" r="3" fill="#C9A7FF"/><circle cx="1078" cy="37" r="2" fill="#65E5F5"/>
  <text class="heading" x="32" y="52">From catalog to host</text>
  <text class="body" x="32" y="82">Select deliberately. Preview before writing. Verify in the host.</text>
  <g aria-hidden="true"><path class="line" d="M304 220 H324"/><path class="line" d="M586 220 H606"/><path class="line" d="M868 220 H888"/></g>
  <g>
    <rect class="card" x="32" y="112" width="272" height="220" rx="16"/>
    <text class="label" x="52" y="152">01  Catalog</text>
    <text class="mono" x="52" y="191">&lt;name&gt;/SKILL.md</text>
    <text class="mono" x="52" y="223">skills.json</text>
    <text class="body" x="52" y="265">Categories, bundles</text><text class="body" x="52" y="291">and relationships</text>
    <rect class="card" x="324" y="112" width="262" height="220" rx="16"/>
    <text class="label" x="344" y="152">02  Select</text>
    <text class="body" x="344" y="192">Browse or search</text><text class="body" x="344" y="222">names and bundles</text>
    <text class="mono" x="344" y="273">install --dry-run</text>
    <rect class="card" x="606" y="112" width="262" height="220" rx="16"/>
    <text class="label" x="626" y="152">03  Install</text>
    <text class="mono" x="626" y="195">npx skills@1.7.0</text><text class="mono" x="626" y="225">add</text>
    <text class="body" x="626" y="273">Selected host roots</text>
    <rect class="card" x="888" y="112" width="280" height="220" rx="16"/>
    <text class="label" x="908" y="152">04  Verify</text>
    <text class="mono" x="908" y="195">jeo-skill doctor</text>
    <text class="body" x="908" y="243">Check host discovery;</text><text class="body" x="908" y="271">reload if needed</text>
  </g>
  <rect x="32" y="356" width="548" height="116" rx="16" fill="#171634" stroke="#7761A7"/>
  <text class="label" x="52" y="391">Guided setup</text>
  <text class="body" x="52" y="423">Separate path; full catalog by default.</text><text class="body" x="52" y="450">Ask for core only to narrow the selection.</text>
  <rect x="600" y="356" width="568" height="116" rx="16" fill="#171634" stroke="#C9A7FF" stroke-dasharray="7 5"/>
  <text class="label" x="620" y="391">Optional, independently configured</text>
  <text class="body" x="620" y="423">OpenSpace routing · Jev · Jevgrep</text><text class="body" x="620" y="450">Host support and approvals vary.</text>
  <rect x="0" y="500" width="1200" height="70" fill="#111C38"/>
  <text x="600" y="542" text-anchor="middle" font-size="20" font-weight="600">File placement is not activation or provider authorization.</text>
</svg>
