<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1110" viewBox="0 0 1200 1110" role="img" aria-labelledby="title desc">
  <title id="title">Catalog, host authority, and optional runtime integrations</title>
  <desc id="desc">Catalog projections supply instructions. The host owns permissions, coding-model selection, and execution. Optional Jev routing, context pruning, review receipts, and usage ledger remain advisory to host authority. Jevgrep remote discovery has a separate approval gate. Offline operator preflights report runtime_verified:false and are separate from upstream app execution.</desc>
  <defs>
    <style>
      text{fill:#12231E;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:21px}
      .heading{font-size:34px;font-weight:700}.label{font-size:24px;font-weight:700}.small{font-size:19px}
      .cmd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:19px}
      .card{fill:#FFFFFF;stroke:#137E73;stroke-width:2}
      .optional{fill:#FFFFFF;stroke:#AC6415;stroke-width:2;stroke-dasharray:9 7}
      .flow{fill:none;stroke:#137E73;stroke-width:3;marker-end:url(#arrow)}
      .branch{fill:none;stroke:#AC6415;stroke-width:3;stroke-dasharray:9 7;marker-end:url(#optional-arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#137E73"/></marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M1 1 9 5 1 9" fill="none" stroke="#AC6415" stroke-width="2" stroke-dasharray="3 2"/></marker>
  </defs>
  <rect width="1200" height="1110" fill="#F7F9F5"/>
  <text x="40" y="60" class="heading">Instructions inform. The host decides and executes.</text>
  <text x="40" y="96">Solid teal: core flow. Dashed amber: optional, separately enabled branches.</text>

  <rect x="40" y="135" width="430" height="245" rx="16" class="card"/>
  <text x="64" y="173" class="label">Catalog projection boundary</text>
  <text x="64" y="215" class="cmd">.agent-skills/skills.json</text>
  <text x="64" y="254">skills.toon · README tables</text>
  <text x="64" y="288">Skill frontmatter projections</text>
  <text x="64" y="328" class="small">model_policies stays in skills.json;</text>
  <text x="64" y="357" class="small">model advice is outside table projections.</text>
  <path d="M470 255H520" class="flow"/>

  <rect x="520" y="135" width="640" height="245" rx="16" fill="#E4F1E9" stroke="#137E73" stroke-width="3"/>
  <text x="544" y="173" class="label">Host authority boundary</text>
  <text x="544" y="215">Permissions and approvals</text>
  <text x="544" y="252">Coding-model selection</text>
  <text x="544" y="289">Tool execution and validation</text>
  <text x="544" y="329" class="small">Jev cannot grant host permission or automatically</text>
  <text x="544" y="358" class="small">switch the coding model.</text>

  <path d="M745 380V411H307V450M935 380V450" class="branch"/>
  <rect x="40" y="450" width="535" height="305" rx="16" class="optional"/>
  <text x="64" y="490" class="label">Optional Jev · profile opt-in</text>
  <text x="64" y="534" class="cmd">route-skills</text>
  <text x="255" y="534" class="small">Skill and model suggestions</text>
  <text x="64" y="573" class="cmd">prune-context</text>
  <text x="255" y="573" class="small">Context advice</text>
  <text x="64" y="612" class="cmd">review</text>
  <text x="255" y="612" class="small">Verdicts and bound receipts</text>
  <text x="64" y="656" class="cmd">jev-usage.jsonl</text>
  <text x="64" y="690" class="small">Ledger separates routed from injected skills.</text>
  <text x="64" y="724" class="small">Host permissions remain the final boundary.</text>

  <rect x="615" y="450" width="545" height="305" rx="16" class="optional"/>
  <text x="639" y="490" class="label">Optional Jevgrep · separate opt-in</text>
  <text x="639" y="533">Remote source-document discovery</text>
  <text x="639" y="575" class="cmd">jeo-skill explore "task"</text>
  <text x="639" y="607" class="cmd">  --root ./source --dry-run</text>
  <text x="639" y="650" class="small">Preview is inert. Remote execution requires</text>
  <text x="639" y="679" class="small">separate content / cost approval:</text>
  <text x="639" y="724" class="cmd">--allow-remote</text>

  <rect x="40" y="810" width="1120" height="255" rx="16" class="card"/>
  <text x="64" y="851" class="label">Operator readiness is separate from upstream execution</text>
  <rect x="64" y="878" width="463" height="160" rx="12" fill="#EDF1E9"/>
  <text x="84" y="914" class="label">Offline preflight</text>
  <text x="84" y="952" class="cmd">runtime_verified:false</text>
  <text x="84" y="991" class="small">Source and local prerequisite evidence</text>
  <text x="84" y="1019" class="small">No upstream runtime activation proof</text>
  <path d="M527 958H658" class="branch"/>
  <text x="554" y="925" class="small">Approve</text>
  <rect x="658" y="878" width="478" height="160" rx="12" class="optional"/>
  <text x="682" y="914" class="label">Upstream apps and services</text>
  <text x="682" y="952" class="small">Installation, authentication, model loading,</text>
  <text x="682" y="985" class="small">and live execution need separate checks</text>
  <text x="682" y="1018" class="small">under the host's permissions.</text>
</svg>
