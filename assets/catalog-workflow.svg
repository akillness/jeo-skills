<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="wf-title wf-desc" viewBox="0 0 1000 920">
  <title id="wf-title">jeo-skills: from catalog to host execution</title>
  <desc id="wf-desc">A solid core path takes the central manifest through browsing and selection, preview and installation using shared or native transports, then installed skill instructions combined with the user's spec into host-owned execution. Catalog discovery reads the central manifest and uses the skills CLI pinned to version 1.7.0. The default catalog path executes no model or provider backend. A dashed, optional verification loop is recommended but never automatic, and can feed findings back into execution.</desc>
  <defs>
    <marker id="wf-core-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#137E73" stroke-width="2"/></marker>
    <marker id="wf-option-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#AC6415" stroke-width="2"/></marker>
    <style>
      svg { width: 100%; height: auto; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #12231E; font-size: 22px; }
      .wf-title { font-size: 34px; font-weight: 700; }
      .wf-heading { font-size: 27px; font-weight: 650; }
      .wf-label { font-size: 19px; font-weight: 650; letter-spacing: 1px; }
      .wf-small { font-size: 20px; }
      .wf-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; }
      .wf-teal { fill: #137E73; }
      .wf-amber { fill: #AC6415; }
      .wf-node { fill: #F7F9F5; stroke: #12231E; stroke-width: 1.6; }
      .wf-core { fill: none; stroke: #137E73; stroke-width: 2.4; marker-end: url(#wf-core-arrow); }
      .wf-option { fill: none; stroke: #AC6415; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#wf-option-arrow); }
    </style>
  </defs>
  <rect width="1000" height="920" rx="20" fill="#F7F9F5"/>
  <text x="40" y="58" class="wf-title">From catalog to host execution</text>
  <text x="40" y="94">Skill documents · categories · one central manifest</text>
  <path d="M40 118H960" stroke="#12231E" stroke-width="1.2"/>
  <text x="40" y="151" class="wf-label wf-teal">CATALOG PATH / NO MODEL OR PROVIDER BACKEND</text>

  <rect x="40" y="178" width="280" height="176" rx="10" class="wf-node"/>
  <text x="62" y="216" class="wf-heading">Manifest</text>
  <text x="62" y="252" class="wf-mono">.agent-skills/</text>
  <text x="62" y="279" class="wf-mono">skills.json</text>
  <text x="62" y="322" class="wf-small">One metadata source</text>

  <path d="M320 266H378" class="wf-core"/>
  <rect x="380" y="178" width="250" height="176" rx="10" class="wf-node"/>
  <text x="402" y="216" class="wf-heading">Browse / select</text>
  <text x="402" y="252" class="wf-mono">jeo-skill</text>
  <text x="402" y="288" class="wf-small">Categories · bundles</text>
  <text x="402" y="322" class="wf-small">Choose skill names</text>

  <path d="M630 266H688" class="wf-core"/>
  <rect x="690" y="178" width="270" height="176" rx="10" class="wf-node"/>
  <text x="712" y="216" class="wf-heading">Preview / install</text>
  <text x="712" y="252" class="wf-mono">--dry-run → install</text>
  <text x="712" y="288" class="wf-small">Shared + native transports</text>
  <text x="712" y="322" class="wf-mono">skills@1.7.0</text>

  <path d="M825 354V400H300V454" class="wf-core"/>
  <text x="398" y="389" class="wf-small wf-teal">Installed SKILL.md files</text>

  <rect x="80" y="456" width="440" height="176" rx="10" class="wf-node"/>
  <text x="104" y="497" class="wf-heading">Host skill use</text>
  <text x="104" y="538">Installed skill instructions</text>
  <text x="104" y="570">+ the user's spec</text>
  <text x="104" y="608" class="wf-small">Host loads and applies the skill</text>

  <path d="M520 536H648" class="wf-core"/>
  <text x="553" y="521" class="wf-small wf-teal">apply</text>
  <rect x="650" y="456" width="310" height="176" rx="10" class="wf-node"/>
  <text x="674" y="497" class="wf-heading">Execution</text>
  <text x="674" y="538">Host's real coding model</text>
  <text x="674" y="570">Host permissions apply</text>
  <text x="674" y="608" class="wf-small">Produce the requested work</text>

  <rect x="80" y="702" width="350" height="102" rx="10" class="wf-node"/>
  <text x="104" y="742" class="wf-heading">User's spec</text>
  <text x="104" y="778" class="wf-small">Intent · constraints · acceptance</text>
  <path d="M255 702V634" class="wf-core"/>
  <text x="270" y="677" class="wf-small wf-teal">input</text>

  <path d="M805 632V730" class="wf-option"/>
  <text x="823" y="686" class="wf-small wf-amber">opt-in</text>
  <rect x="650" y="732" width="310" height="134" rx="10" fill="#F7F9F5" stroke="#AC6415" stroke-width="1.8" stroke-dasharray="7 6"/>
  <text x="674" y="771" class="wf-heading wf-amber">Optional verification</text>
  <text x="674" y="809" class="wf-small">Recommended, not automatic</text>
  <text x="674" y="842" class="wf-small">Check results against the spec</text>
  <path d="M650 815H566V591H648" class="wf-option"/>
  <text x="578" y="676" class="wf-small wf-amber">refine</text>
  <text x="578" y="702" class="wf-small wf-amber">/ retry</text>

  <text x="40" y="899" class="wf-small">Solid teal: core flow</text>
  <text x="350" y="899" class="wf-small wf-amber">Dashed amber: optional feedback</text>
</svg>
