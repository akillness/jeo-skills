<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="catalog-title catalog-desc">
  <title id="catalog-title">Skill catalog category map</title>
  <desc id="catalog-desc">Ten equal tiles in five columns and two rows map the skill categories, each with a geometric icon and three subcategories: Web — frontend, design, data; Infrastructure — deployment, observability, security; Game — design-ui, motion-vfx, qa-performance; Creative Media — image, video, diagram; CLI Tools — ai-cli, search-cli, automation-cli; AI &amp; Agents — orchestration, agent-frameworks, evaluation; Engineering — code-quality, architecture, testing; Research &amp; Analysis — academic, web-research, intelligence; Business — pm-discovery, pm-strategy, marketing; Utilities — knowledge, files, git.</desc>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #12231E; }
    .tile { fill: #F7F9F5; stroke: #DCE4DE; stroke-width: 1.5; }
    .name { font-size: 22px; font-weight: 650; letter-spacing: -0.4px; }
    .label { font-size: 18px; font-weight: 400; }
    .icon { fill: none; stroke: #137E73; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .command { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
  <rect width="1200" height="520" fill="#F7F9F5"/>

  <g transform="translate(32 32)">
    <rect class="tile" width="208" height="216" rx="8"/>
    <g class="icon" transform="translate(16 20)" aria-hidden="true">
      <rect x="2" y="2" width="40" height="32" rx="3"/>
      <path d="M2 12h40M14 12v22"/>
      <path d="M20 19h15M20 26h10"/>
    </g>
