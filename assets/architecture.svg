<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="100%" height="100%" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">jeo-skills: shared catalog, optional Jevgrep discovery and optional Jev runtime</title>
  <desc id="architecture-desc">The 353-skill shared catalog and jeo-skill router distribute selected skills to host agents; catalog installation is not execution. Local metadata, native exact search, LSP and zvec retrieval remain the defaults, as do Graphify query, path and explain. Jevgrep is a separate optional source-discovery CLI, not the Jev decision harness. jeo-skill explore requires an explicit root; dry-run is inert, and provider requests require separate --allow-remote approval plus preinstalled jg and saved credentials. It searches skills, wiki markdown and graph source text, not graph databases or binary traversal; it does not mutate or rebuild graphs. Jev is a separate optional setup branch that can be skipped. Its status distinguishes opt-in configuration from backend readiness. Only a host that adopts the installed rule invokes the harness for skill routing, context pruning, or proposal review. The harness calls a separately available API, local server, Ollama, or LM Studio backend. Installed files, an API key, and mock checks do not prove live integration. Inactive Jev is bypassed; configured backend failures do not permit autonomous action.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#060B14"/><stop offset="50%" stop-color="#0A1525"/><stop offset="100%" stop-color="#0D1B2E"/>
    </linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="14" cy="14" r="1" fill="#1E3A5F" opacity="0.3"/></pattern>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1D4ED8"/><stop offset="25%" stop-color="#8B5CF6"/><stop offset="50%" stop-color="#10B981"/><stop offset="75%" stop-color="#F59E0B"/><stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/></marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { font-size: 30px; font-weight: 800; fill: #F1F5F9; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      .heading { font-size: 17px; font-weight: 700; fill: #F1F5F9; }
      .body { font-size: 14px; fill: #CBD5E1; }
      .note { font-size: 12px; fill: #94A3B8; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #E2E8F0; }
      .card { fill: #0B1526; stroke-width: 1.5; }
      .connector { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #F87171; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#optional-arrow); }
    </style>
  </defs>
  <rect width="1200" height="850" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="850" rx="18" fill="url(#dots)"/>
  <rect width="1200" height="3" rx="2" fill="url(#topBar)"/>
  <text x="600" y="52" class="title" text-anchor="middle">jeo-skills Architecture</text>
  <text x="600" y="79" class="body" text-anchor="middle">Shared catalog · optional Jevgrep source discovery · separate optional Jev decision harness</text>

  <text x="60" y="119" class="section" fill="#60A5FA">CATALOG DISTRIBUTION — NOT BACKEND EXECUTION</text>
  <line x1="60" y1="130" x2="1140" y2="130" stroke="#1E3A5F"/>
  <rect x="60" y="150" width="320" height="122" rx="12" class="card" stroke="#3B82F6"/>
  <text x="80" y="179" class="heading">Catalog source</text>
  <text x="80" y="205" class="mono">SKILL.md + skills.json</text>
  <text x="80" y="229" class="body">353 skills · categories · bundles</text>
  <text x="80" y="252" class="note">Metadata and instructions, not a live service</text>
  <path d="M 380 211 H 420" class="connector"/>
  <rect x="420" y="150" width="320" height="122" rx="12" class="card" stroke="#8B5CF6"/>
  <text x="440" y="179" class="heading">Shared jeo-skill router</text>
  <text x="440" y="205" class="mono">npx skills add → bootstrap</text>
  <text x="440" y="229" class="body">Resolve target; install selected content</text>
  <text x="440" y="252" class="note">Transport into shared skills / target surfaces</text>
  <path d="M 740 211 H 780" class="connector"/>
  <rect x="780" y="150" width="360" height="122" rx="12" class="card" stroke="#10B981"/>
  <text x="800" y="179" class="heading">Host agent / runtime</text>
  <text x="800" y="205" class="body">Discover and invoke relevant skills</text>
  <text x="800" y="229" class="body">Claude · Codex · Gemini · other targets</text>
  <text x="800" y="252" class="note">Target support / reload checked separately</text>
  <text x="60" y="287" class="note">Default: local metadata / native exact / LSP / zvec; Graphify query / path / explain.</text>
  <path d="M 960 272 V 299 H 790" class="connector"/>
  <text x="760" y="305" class="body" text-anchor="end" fill="#6EE7B7">Direct host workflow requires neither Jev nor Jevgrep</text>
  <text x="60" y="325" class="body">Optional Jevgrep (not Jev): --root + --allow-remote; --dry-run is inert; graph source text only, no traversal / rebuild.</text>

  <text x="60" y="346" class="section" fill="#F87171">OPTIONAL JEV SETUP — SEPARATE FROM CATALOG INSTALL</text>
  <line x1="60" y1="357" x2="1140" y2="357" stroke="#1E3A5F"/>
  <rect x="60" y="378" width="320" height="145" rx="12" class="card" stroke="#F87171" stroke-dasharray="6 5"/>
  <text x="80" y="407" class="heading">Opt-in setup branch</text>
  <text x="80" y="433" class="mono">jev/jev-setup.sh</text>
  <text x="80" y="457" class="body">API · local · Ollama · LM Studio</text>
  <text x="80" y="481" class="body">Skip / decline / no TTY + unset → bypass</text>
  <text x="80" y="505" class="note">Installs harness, config and rule artifact</text>
  <path d="M 380 450 H 420" class="optional"/>
  <rect x="420" y="378" width="320" height="145" rx="12" class="card" stroke="#F59E0B"/>
  <text x="440" y="407" class="heading">Configuration ≠ readiness</text>
  <text x="440" y="433" class="mono">jev-harness.mjs status</text>
  <text x="440" y="457" class="body">active: configured opt-in</text>
  <text x="440" y="481" class="body">ready: true / false / null (unprobed)</text>
  <text x="440" y="505" class="note">API key presence is not an inference test</text>
  <path d="M 740 450 H 780" class="optional"/>
  <rect x="780" y="378" width="360" height="145" rx="12" class="card" stroke="#EC4899"/>
  <text x="800" y="407" class="heading">Host adopts the rule</text>
  <text x="800" y="433" class="body">Host must load and follow instructions</text>
  <text x="800" y="457" class="body">Then invoke Jev at relevant task events</text>
  <text x="800" y="481" class="body">No default enforced native hooks</text>
  <text x="800" y="505" class="note">Installed rule file alone proves no integration</text>

  <text x="60" y="567" class="section" fill="#A78BFA">RULE-DRIVEN CALLS — OPTIONAL EXTERNAL BACKENDS</text>
  <line x1="60" y1="578" x2="1140" y2="578" stroke="#1E3A5F"/>
  <path d="M 960 523 V 588 H 220 V 602" class="optional"/>
  <rect x="60" y="602" width="320" height="124" rx="12" class="card" stroke="#EC4899"/>
  <text x="80" y="632" class="heading">Jev harness</text>
  <text x="80" y="660" class="mono">route-skills · prune-context · review</text>
  <text x="80" y="684" class="body">Read-only catalog; keep/drop proposals</text>
  <text x="80" y="708" class="body">Review verdict + SHA-256 receipt</text>
  <path d="M 380 664 H 420" class="optional" marker-start="url(#optional-arrow)"/>
  <rect x="420" y="602" width="320" height="124" rx="12" class="card" stroke="#8B5CF6"/>
  <text x="440" y="632" class="heading">Hosted API / local server</text>
  <text x="440" y="660" class="body">TypeSafe System One (API)</text>
  <text x="440" y="684" class="body">JEV-9B via jev_local_server.py</text>
  <text x="440" y="708" class="note">Local model is a third-party distillation</text>
  <path d="M 380 714 V 741 H 960 V 726" class="optional" marker-start="url(#optional-arrow)"/>
  <rect x="780" y="602" width="360" height="124" rx="12" class="card" stroke="#059669"/>
  <text x="800" y="632" class="heading">Ollama / LM Studio</text>
  <text x="800" y="660" class="body">Quantized JEV-9B-GGUF</text>
  <text x="800" y="684" class="body">Harness adapts generative responses</text>
  <text x="800" y="708" class="note">Server and selected model must be available</text>

  <text x="60" y="779" class="body">Solid arrows: catalog / host path. Dashed arrows: optional Jev setup and calls, not a mandatory stage.</text>
  <text x="60" y="803" class="body">Inactive → bypass Jev; normal host permission/confirmation policies apply. Configured failures → fail closed.</text>
  <text x="60" y="827" class="note">Mock checks validate offline contracts only. Live backend success and host invocation require separate evidence.</text>
</svg>
