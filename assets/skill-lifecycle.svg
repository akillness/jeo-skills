<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="skill-lifecycle-title skill-lifecycle-desc">
  <title id="skill-lifecycle-title">Skill lifecycle: track, clean up locally, and maintain</title>
  <desc id="skill-lifecycle-desc">Three horizontal lanes. Track runtime records through usage scan, local usage summaries and scan metadata without transcript bodies, and usage report states: used, protected, in grace for 30 days, or candidate. Mentions never count. Clean up locally by previewing prune-unused, applying with Jev review or a recorded skip, and creating a quarantine batch, then branch to restore or purge older quarantine. Maintainers run scripts/retire-unused-skills.py with approved names, regenerate and validate, and roll back on failure.</desc>
  <defs>
    <style>
      text { fill: #12231E; font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 18px; }
      .heading { font-size: 22px; font-weight: 700; }
      .command { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 18px; }
      .branch-command { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 17.5px; }
      .node { fill: #F7F9F5; stroke: #137E73; stroke-width: 1.5; }
      .flow { fill: none; stroke: #137E73; stroke-width: 2; stroke-linejoin: round; marker-end: url(#arrow); }
      .review { fill: #F7F9F5; stroke: #AC6415; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .review-text { fill: #AC6415; }
    </style>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#137E73"/>
    </marker>
  </defs>
  <rect width="1200" height="600" fill="#F7F9F5"/>
  <text x="32" y="44" font-weight="700" style="font-size:30px">Skill lifecycle</text>
  <text x="1168" y="42" text-anchor="end">mentions never count</text>
  <!-- Lanes are separated by open gutters. -->
  <rect x="32" y="68" width="1136" height="180" rx="12" fill="#F7F9F5" stroke="#DCE4DE"/>
  <rect x="32" y="260" width="1136" height="184" rx="12" fill="#F7F9F5" stroke="#DCE4DE"/>
  <rect x="32" y="456" width="1136" height="112" rx="12" fill="#DCE4DE"/>
  <!-- Connectors precede the nodes and stay in the intervening gutters. -->
  <g aria-hidden="true">
    <path class="flow" d="M 400 156 H 432"/>
    <path class="flow" d="M 580 156 H 612"/>
    <path class="flow" d="M 916 156 H 948"/>
    <path class="flow" d="M 1050 184 V 204"/>
    <path class="flow" d="M 280 356 H 312"/>
    <path class="flow" d="M 572 356 H 604"/>
    <path class="flow" d="M 804 356 H 828 V 336 H 856"/>
    <path class="flow" d="M 804 364 H 836 V 404 H 856"/>
    <path class="flow" d="M 444 524 H 476"/>
    <path class="flow" d="M 664 524 H 696"/>
    <path class="flow" d="M 932 524 H 964"/>
  </g>
  <g role="group" aria-label="Track">
    <text class="heading" x="48" y="96">Track:</text>
    <rect class="node" x="48" y="112" width="352" height="112" rx="8"/>
    <text x="64" y="138" font-weight="600">runtime records</text>
    <text x="64" y="162"><tspan x="64">(Claude, Codex, OpenCode, </tspan><tspan x="64" dy="24">Antigravity, Aside, jeopi/GJC/OMP/Pi, </tspan><tspan x="64" dy="24">Jev ledger)</tspan></text>
    <rect class="node" x="432" y="128" width="148" height="56" rx="8"/>
    <text class="command" x="506" y="162" text-anchor="middle">usage scan</text>
    <rect class="node" x="612" y="116" width="304" height="80" rx="8"/>
    <text x="628" y="140"><tspan x="628">local state: usage summaries </tspan><tspan x="628" dy="24">+ scan metadata </tspan><tspan x="628" dy="24">(no transcript bodies)</tspan></text>
    <rect class="node" x="948" y="128" width="204" height="56" rx="8"/>
    <text class="command" x="1050" y="162" text-anchor="middle">usage report</text>
    <text x="1152" y="228" text-anchor="end">used / protected / in grace (30 days) / candidate</text>
  </g>
  <g role="group" aria-label="Clean up locally">
    <text class="heading" x="48" y="290">Clean up locally:</text>
    <rect class="node" x="48" y="312" width="232" height="92" rx="8"/>
    <text class="command" x="164" y="348" text-anchor="middle">prune-unused</text>
    <text x="164" y="376" text-anchor="middle">(preview)</text>
    <rect class="review" x="312" y="312" width="260" height="92" rx="8"/>
    <text class="command" x="442" y="340" text-anchor="middle">--apply</text>
    <text class="review-text" x="442" y="366" text-anchor="middle"><tspan x="442">(Jev review or </tspan><tspan x="442" dy="24">recorded skip)</tspan></text>
    <rect class="node" x="604" y="312" width="200" height="92" rx="8"/>
    <text x="704" y="362" text-anchor="middle">quarantine batch</text>
    <rect class="node" x="856" y="308" width="296" height="56" rx="8"/>
    <text class="branch-command" x="872" y="330"><tspan x="872">restore --batch &lt;id&gt; </tspan><tspan x="872" dy="24">--apply</tspan></text>
    <rect class="node" x="856" y="376" width="296" height="56" rx="8"/>
    <text class="branch-command" x="872" y="398"><tspan x="872">purge-quarantine </tspan><tspan x="872" dy="24">--older-than N --apply</tspan></text>
  </g>
  <g role="group" aria-label="Maintainer">
    <text class="heading" x="48" y="484">Maintainer:</text>
    <rect class="node" x="48" y="500" width="396" height="48" rx="8"/>
    <text class="command" x="246" y="530" text-anchor="middle">scripts/retire-unused-skills.py</text>
    <rect class="node" x="476" y="500" width="188" height="48" rx="8"/>
    <text x="570" y="530" text-anchor="middle">approved names</text>
    <rect class="node" x="696" y="500" width="236" height="48" rx="8"/>
    <text x="814" y="530" text-anchor="middle">regenerate + validate</text>
    <rect class="node" x="964" y="500" width="188" height="48" rx="8"/>
    <text x="1058" y="520" text-anchor="middle"><tspan x="1058">rollback </tspan><tspan x="1058" dy="20">on failure</tspan></text>
  </g>
</svg>
