<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rt-title rt-desc" viewBox="0 0 1000 1730">
  <title id="rt-title">jeo-skills: catalog, host runtime, and optional integrations</title>
  <desc id="rt-desc">The single canonical catalog manifest, .agent-skills/skills.json, indexes flat skill folders and their categories. It generates TOON and README table projections, which are validated against the manifest. The installer, pinned to skills CLI 1.7.0, previews and writes shared or native skill files to real host filesystem paths. The host combines installed skills with the user's spec, applies its own permissions, and executes with its real coding model. Two distinct dashed amber lanes are optional additions: Jev offers api, local, ollama, lmstudio, and systemone decision backends, independent profile activation, hook trust, and package/session loading; Codex assist uses native UserPromptSubmit hooks and a separate PreToolUse review mode. Only older Jev-owned Pi-family blocks may be pruned or replaced. Jevgrep is a separate search/grep CLI with a jeo-skill explore wrapper using --root, --dry-run, and --allow-remote; output is text only and knowledge graphs are never touched or rebuilt. Both lanes remain subject to host-owned permissions and never replace the real coding model.</desc>
  <defs>
    <marker id="rt-core-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#137E73" stroke-width="2"/></marker>
    <marker id="rt-option-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M1 1 9 5 1 9" fill="none" stroke="#AC6415" stroke-width="2"/></marker>
    <style>
      svg { width: 100%; height: auto; }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #12231E; font-size: 22px; }
      .rt-title { font-size: 34px; font-weight: 700; }
      .rt-heading { font-size: 26px; font-weight: 650; }
      .rt-label { font-size: 19px; font-weight: 650; letter-spacing: 1px; }
      .rt-small { font-size: 20px; }
      .rt-mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 20px; }
      .rt-teal { fill: #137E73; }
      .rt-amber { fill: #AC6415; }
      .rt-node { fill: #F7F9F5; stroke: #12231E; stroke-width: 1.6; }
      .rt-core { fill: none; stroke: #137E73; stroke-width: 2.4; marker-end: url(#rt-core-arrow); }
      .rt-option { fill: none; stroke: #AC6415; stroke-width: 2.2; stroke-dasharray: 7 6; marker-end: url(#rt-option-arrow); }
      .rt-boundary { fill: #F7F9F5; stroke: #AC6415; stroke-width: 1.8; stroke-dasharray: 8 6; }
      .rt-divider { stroke: #AC6415; stroke-width: 1; }
    </style>
  </defs>
  <rect width="1000" height="1730" rx="20" fill="#F7F9F5"/>
  <text x="40" y="58" class="rt-title">One catalog. Host-owned execution.</text>
  <text x="40" y="96">Optional integrations add assistance within the host's authority.</text>
  <path d="M40 120H960" stroke="#12231E" stroke-width="1.2"/>
  <text x="40" y="153" class="rt-label rt-teal">CORE / DEFAULT CATALOG PATH EXECUTES NO BACKEND</text>

  <rect x="40" y="176" width="430" height="202" rx="10" class="rt-node"/>
  <text x="64" y="215" class="rt-heading">Single canonical source</text>
  <text x="64" y="251" class="rt-mono">.agent-skills/skills.json</text>
  <text x="64" y="286">Skills and categories</text>
  <text x="64" y="323" class="rt-small">Flat skill documents:</text>
  <text x="64" y="354" class="rt-mono">.agent-skills/&lt;name&gt;/SKILL.md</text>

  <path d="M470 251H548" class="rt-core"/>
  <text x="481" y="234" class="rt-small rt-teal">project</text>
  <rect x="550" y="176" width="410" height="135" rx="10" class="rt-node"/>
  <text x="574" y="215" class="rt-heading">Catalog projections</text>
  <text x="574" y="253" class="rt-mono">skills.toon</text>
  <text x="574" y="286">README category tables</text>

  <path d="M755 311V354" class="rt-core"/>
  <rect x="550" y="356" width="410" height="98" rx="10" class="rt-node"/>
  <text x="574" y="395" class="rt-heading">Validate against skills.json</text>
  <text x="574" y="430" class="rt-small">Read-only projection / drift checks</text>
  <path d="M470 335H510V405H548" class="rt-core"/>

  <path d="M255 378V471" class="rt-core"/>
  <text x="273" y="430" class="rt-small rt-teal">selected names</text>
  <rect x="40" y="473" width="430" height="168" rx="10" class="rt-node"/>
  <text x="64" y="512" class="rt-heading">jeo-skill installer</text>
  <text x="64" y="548">Preview → shared / native transports</text>
  <text x="64" y="582" class="rt-mono">CLI pin: skills@1.7.0</text>
  <text x="64" y="617" class="rt-small">Writes real host filesystem paths</text>

  <path d="M470 559H548" class="rt-core"/>
  <text x="481" y="542" class="rt-small rt-teal">write</text>
  <rect x="550" y="489" width="410" height="174" rx="10" class="rt-node"/>
  <text x="574" y="528" class="rt-heading">Installed SKILL.md files</text>
  <text x="574" y="563" class="rt-mono">~/.agents/skills</text>
  <text x="574" y="595" class="rt-small">or project .agents/skills</text>
  <text x="574" y="631" class="rt-small">Native example: ~/.gjc/agent/skills</text>
  <path d="M800 663V712" class="rt-core"/>

  <rect x="40" y="714" width="920" height="248" rx="12" fill="#F7F9F5" stroke="#137E73" stroke-width="2.4"/>
  <text x="64" y="752" class="rt-label rt-teal">HOST-OWNED EXECUTION &amp; PERMISSION BOUNDARY</text>
  <rect x="64" y="777" width="306" height="121" rx="8" class="rt-node"/>
  <text x="84" y="814" class="rt-heading">Skill context + spec</text>
  <text x="84" y="848" class="rt-small">Installed instructions</text>
  <text x="84" y="878" class="rt-small">combined with the user's spec</text>
  <path d="M370 839H418" class="rt-core"/>
  <rect x="420" y="777" width="210" height="121" rx="8" class="rt-node"/>
  <text x="440" y="814" class="rt-heading">Permissions</text>
  <text x="440" y="848" class="rt-small">Host authorization</text>
  <text x="440" y="878" class="rt-small">still required</text>
  <path d="M630 839H678" class="rt-core"/>
  <rect x="680" y="777" width="256" height="121" rx="8" class="rt-node"/>
  <text x="700" y="814" class="rt-heading">Real coding model</text>
  <text x="700" y="848" class="rt-small">Host-selected model</text>
  <text x="700" y="878" class="rt-small">executes the work</text>
  <text x="64" y="937" class="rt-small">Both optional lanes remain subject to these permissions and this execution path.</text>

  <path d="M315 1050V964" class="rt-option"/>
  <text x="80" y="1015" class="rt-small rt-amber">optional context / review</text>
  <path d="M800 1050V964" class="rt-option"/>
  <text x="817" y="1015" class="rt-small rt-amber">source text</text>

  <rect x="40" y="1052" width="565" height="628" rx="12" class="rt-boundary"/>
  <text x="64" y="1092" class="rt-heading rt-amber">OPTIONAL / Jev assistant</text>
  <text x="64" y="1127" class="rt-small">Five selectable decision backends:</text>
  <text x="64" y="1160" class="rt-mono">api · local · ollama · lmstudio · systemone</text>
  <path d="M64 1183H581" class="rt-divider"/>
  <text x="64" y="1217" class="rt-heading">Independent activation stages</text>
  <text x="64" y="1252" class="rt-small">Profile configuration + ON/OFF</text>
  <text x="64" y="1283" class="rt-small">Hook registration + exact-definition trust</text>
  <text x="64" y="1314" class="rt-small">Native package / session loading</text>
  <path d="M64 1336H581" class="rt-divider"/>
  <text x="64" y="1370" class="rt-heading">Codex assist / native hooks</text>
  <text x="64" y="1405" class="rt-small">UserPromptSubmit → trusted skill context</text>
  <text x="64" y="1436" class="rt-small">PreToolUse → off / advisory / enforce review</text>
  <text x="64" y="1472" class="rt-small">Enforce: validated permit still needs host approval.</text>
  <text x="64" y="1503" class="rt-small">Hooks may fail open; no host permission grant.</text>
  <path d="M64 1526H581" class="rt-divider"/>
  <text x="64" y="1560" class="rt-heading">Pi-family context only</text>
  <text x="64" y="1595" class="rt-small">Prune/replace older Jev-owned blocks only.</text>
  <text x="64" y="1626" class="rt-small">Keep the newest block and all other messages.</text>
  <text x="64" y="1657" class="rt-small">Host permissions and coding model stay unchanged.</text>

  <rect x="635" y="1052" width="325" height="628" rx="12" class="rt-boundary"/>
  <text x="659" y="1092" class="rt-label rt-amber">OPTIONAL / Jevgrep</text>
  <text x="659" y="1127" class="rt-heading">Search / grep lane</text>
  <text x="659" y="1160" class="rt-small">Separate jg CLI; wrapper:</text>
  <text x="659" y="1191" class="rt-mono">jeo-skill explore</text>
  <path d="M659 1213H936" class="rt-divider"/>
  <text x="659" y="1247" class="rt-mono">--root PATH</text>
  <text x="659" y="1276" class="rt-small">Explicit source scope</text>
  <text x="659" y="1316" class="rt-mono">--dry-run</text>
  <text x="659" y="1345" class="rt-small">Inert plan; no provider call</text>
  <text x="659" y="1385" class="rt-mono">--allow-remote</text>
  <text x="659" y="1414" class="rt-small">Separate upload/cost consent</text>
  <text x="659" y="1454" class="rt-heading">Text-only output</text>
  <text x="659" y="1483" class="rt-small">Scoped source snippets</text>
  <path d="M659 1506H936" class="rt-divider"/>
  <text x="659" y="1540" class="rt-small">Knowledge graph untouched:</text>
  <text x="659" y="1571" class="rt-small">no mutation or rebuild.</text>
  <text x="659" y="1602" class="rt-small">Search text, not graph files.</text>
  <text x="659" y="1633" class="rt-small">Host permissions + model</text>
  <text x="659" y="1664" class="rt-small">remain host-owned.</text>

  <text x="40" y="1710" class="rt-small rt-amber">Dashed amber boundaries: separate opt-ins; neither lane is required by the core.</text>
</svg>
