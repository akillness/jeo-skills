<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1120" width="100%" height="100%" role="img" aria-labelledby="workflow-title workflow-desc">
  <title id="workflow-title">jeo-skills workflow with separate optional Jevgrep discovery and Jev harness branches</title>
  <desc id="workflow-desc">Catalog distribution installs the shared jeo-skill router and selected skills from the 353-skill catalog for a host agent. The direct host workflow requires neither Jev nor Jevgrep. Local metadata, native exact search, LSP and zvec retrieval remain defaults, as do Graphify query, path and explain. Jevgrep source discovery is separate from the Jev decision harness: jeo-skill explore requires an explicit root, dry-run makes no requests, and provider requests require separate --allow-remote approval plus preinstalled jg and saved credentials. It searches skills, wiki markdown and graph source text only; it does not traverse graph databases or binary data, mutate graphs or rebuild them. Home-scoped Jev setup is optional: skip, decline, or an unset non-interactive mode bypasses setup without fetching Jev. Approved setup selects API, local, Ollama, or LM Studio, installs configuration and rule artifacts, then status reports configuration and limited backend readiness. Host adoption of the rule is separate. An adopting host can invoke route-skills at task discovery, prune-context before compaction, and review before memory writes or agent-authored commits; these are separate lifecycle calls, not mandatory sequential stages. Weak local matches route to find-skills and require approval before installing public skills. Inactive Jev is bypassed under normal host permission and confirmation policies; configured backend errors fail closed. Mock checks and API key presence do not establish live readiness.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050B14"/><stop offset="50%" stop-color="#0A1527"/><stop offset="100%" stop-color="#0D1E36"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="15" cy="15" r="1" fill="#1E3E66" opacity="0.3"/></pattern>
    <linearGradient id="topBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563EB"/><stop offset="35%" stop-color="#7C3AED"/><stop offset="65%" stop-color="#059669"/><stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#94A3B8"/></marker>
    <marker id="optional-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 1 L 9 5 L 0 9 z" fill="#F87171"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .title { font-size: 29px; font-weight: 800; fill: #F1F5F9; }
      .section { font-size: 12px; font-weight: 700; letter-spacing: 1.6px; }
      .heading { font-size: 17px; font-weight: 700; fill: #F1F5F9; }
      .body { font-size: 14px; fill: #CBD5E1; }
      .note { font-size: 12px; fill: #94A3B8; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 13px; fill: #E2E8F0; }
      .card { fill: #0B1526; stroke-width: 1.5; }
      .connector { fill: none; stroke: #94A3B8; stroke-width: 2; marker-end: url(#arrow); }
      .optional { fill: none; stroke: #F87171; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#optional-arrow); }
    </style>
  </defs>
  <rect width="1000" height="1120" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="1120" rx="16" fill="url(#grid)"/>
  <rect width="1000" height="3" rx="2" fill="url(#topBar)"/>
  <text x="500" y="50" class="title" text-anchor="middle">jeo-skills Workflow</text>
  <text x="500" y="78" class="body" text-anchor="middle">Install catalog content; invoke skills through the host. Jev and Jevgrep are separate opt-ins.</text>

  <text x="60" y="117" class="section" fill="#60A5FA">1. SHARED CATALOG DISTRIBUTION</text>
  <line x1="60" y1="128" x2="940" y2="128" stroke="#1E3A5F"/>
  <rect x="60" y="147" width="260" height="98" rx="10" class="card" stroke="#2563EB"/>
  <text x="80" y="177" class="heading">Install shared router</text>
  <text x="80" y="204" class="mono">npx skills add → jeo-skill</text>
  <text x="80" y="227" class="body">Bootstrap requested agent target</text>
  <path d="M 320 196 H 365" class="connector"/>
  <rect x="365" y="147" width="270" height="98" rx="10" class="card" stroke="#2563EB"/>
  <text x="385" y="177" class="heading">Select catalog content</text>
  <text x="385" y="204" class="body">353 skills · categories · bundles · all</text>
  <text x="385" y="227" class="note">Catalog files are not backend execution</text>
  <path d="M 635 196 H 680" class="connector"/>
  <rect x="680" y="147" width="260" height="98" rx="10" class="card" stroke="#059669"/>
  <text x="700" y="177" class="heading">Install into host target</text>
  <text x="700" y="204" class="body">Resolve support / reload as needed</text>
  <text x="700" y="227" class="note">Invoke relevant skills, not the full catalog</text>
  <path d="M 940 196 H 966 V 624 H 40 V 561 H 60" class="connector"/>
  <text x="940" y="269" class="body" text-anchor="end" fill="#6EE7B7">DIRECT PATH — NEITHER JEV NOR JEVGREP REQUIRED</text>
  <text x="60" y="282" class="note">Jevgrep searches skill / wiki / graph source text only; no graph traversal or rebuild.</text>

  <text x="60" y="298" class="section" fill="#F87171">2. OPTIONAL HOME-SCOPED JEV SETUP</text>
  <line x1="60" y1="309" x2="940" y2="309" stroke="#1E3A5F"/>
  <rect x="60" y="328" width="260" height="122" rx="10" class="card" stroke="#F87171" stroke-dasharray="6 5"/>
  <text x="80" y="358" class="heading">Install Jev? [y/N]</text>
  <text x="80" y="384" class="body">Explicit approval / backend mode</text>
  <text x="80" y="408" class="body">Skip / decline / no TTY + unset</text>
  <text x="80" y="431" class="note">No Jev fetch or install on skip</text>
  <path d="M 320 389 H 365" class="optional"/>
  <text x="343" y="377" class="note" text-anchor="middle">yes</text>
  <rect x="365" y="328" width="270" height="122" rx="10" class="card" stroke="#F87171"/>
  <text x="385" y="358" class="heading">Choose backend; configure</text>
  <text x="385" y="384" class="body">API · local · Ollama · LM Studio</text>
  <text x="385" y="408" class="body">Harness + config + rule artifact</text>
  <text x="385" y="431" class="note">Host adoption is a separate step</text>
  <path d="M 635 389 H 680" class="optional"/>
  <rect x="680" y="328" width="260" height="122" rx="10" class="card" stroke="#D97706"/>
  <text x="700" y="358" class="heading">Check status, not inference</text>
  <text x="700" y="384" class="mono">jev-harness.mjs status</text>
  <text x="700" y="408" class="body">active = configured opt-in</text>
  <text x="700" y="431" class="note">ready = true / false / null (unprobed)</text>
  <path d="M 190 450 V 475 H 40 V 561 H 60" class="connector"/>
  <text x="211" y="477" class="note">skip / inactive</text>

  <text x="60" y="498" class="section" fill="#A78BFA">3. HOST WORKFLOW — WITH OR WITHOUT JEV</text>
  <rect x="60" y="514" width="260" height="94" rx="10" class="card" stroke="#7C3AED"/>
  <text x="80" y="544" class="heading">Discover, clarify and plan</text>
  <text x="80" y="571" class="body">Local metadata · exact · LSP · zvec</text>
  <text x="80" y="593" class="note">Graphify query / path / explain</text>
  <path d="M 320 561 H 365" class="connector"/>
  <rect x="365" y="514" width="270" height="94" rx="10" class="card" stroke="#059669"/>
  <text x="385" y="544" class="heading">Execute through host tools</text>
  <text x="385" y="571" class="body">Use installed skills as instructions</text>
  <text x="385" y="593" class="note">Host permissions still apply</text>
  <path d="M 635 561 H 680" class="connector"/>
  <rect x="680" y="514" width="260" height="94" rx="10" class="card" stroke="#D97706"/>
  <text x="700" y="544" class="heading">Verify outcomes</text>
  <text x="700" y="571" class="body">Tests / browser / exact evidence</text>
  <text x="700" y="593" class="note">Installed files do not prove behavior</text>
  <text x="60" y="638" class="note">Optional Jevgrep ≠ Jev: jeo-skill explore QUERY --root DIR --dry-run; requests require --allow-remote.</text>

  <text x="60" y="652" class="section" fill="#F87171">4. IF THE HOST ADOPTS THE RULE: LIFECYCLE-SPECIFIC JEV CALLS</text>
  <text x="60" y="678" class="body">Separate optional calls, not a required route → prune → review pipeline.</text>
  <line x1="60" y1="692" x2="940" y2="692" stroke="#1E3A5F"/>
  <rect x="60" y="711" width="260" height="149" rx="10" class="card" stroke="#F87171" stroke-dasharray="6 5"/>
  <text x="80" y="740" class="heading">route-skills</text>
  <text x="80" y="765" class="body">At task discovery: local catalog first</text>
  <text x="80" y="789" class="body">Return relevant Top-K skills</text>
  <text x="80" y="813" class="body">Weak match → find-skills</text>
  <text x="80" y="837" class="note">Public registry install requires approval</text>
  <rect x="365" y="711" width="270" height="149" rx="10" class="card" stroke="#F87171" stroke-dasharray="6 5"/>
  <text x="385" y="740" class="heading">prune-context</text>
  <text x="385" y="765" class="body">Before long-session compaction</text>
  <text x="385" y="789" class="body">JSONL blocks → keep / drop</text>
  <text x="385" y="813" class="body">Preserve uncertain / keep blocks</text>
  <text x="385" y="837" class="note">Only confident drop proposals remove text</text>
  <rect x="680" y="711" width="260" height="149" rx="10" class="card" stroke="#EC4899" stroke-dasharray="6 5"/>
  <text x="700" y="740" class="heading">review</text>
  <text x="700" y="765" class="body">Before memory writes / commits</text>
  <text x="700" y="789" class="body">permit · proposal_only · reject</text>
  <text x="700" y="813" class="mono">unavailable + SHA-256 receipt</text>
  <text x="700" y="837" class="note">Only a real permit allows autonomy</text>
  <path d="M 190 860 V 880 H 810 V 860" class="optional" marker-start="url(#optional-arrow)"/>
  <path d="M 500 860 V 880" fill="none" stroke="#F87171" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="907" class="body" text-anchor="middle">Harness ↔ optional external API / local / Ollama / LM Studio backend</text>

  <rect x="60" y="935" width="880" height="160" rx="10" class="card" stroke="#1E3A5F"/>
  <text x="80" y="963" class="heading">Configuration, readiness and permission are different checks</text>
  <text x="80" y="988" class="body">status exits: 0 = configured, not known unavailable; 2 = inactive; 3 = configured unavailable / invalid.</text>
  <text x="80" y="1011" class="body">Readiness probes local health / selected-model listing only. An API key leaves readiness unverified.</text>
  <text x="80" y="1034" class="body">Inactive → bypass Jev; normal host permission/confirmation policies apply. Configured outages → fail closed.</text>
  <text x="80" y="1057" class="body">proposal_only → ask the user; reject / unavailable → no autonomous action. Mock is not activation.</text>
  <text x="80" y="1080" class="note">Rule-driven integration, not automatic native hooks. Solid = host path; dashed = optional Jev calls.</text>
</svg>
