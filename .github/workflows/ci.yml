name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      # CI validates, it never rewrites the catalog. The previous steps ran
      # fix_frontmatter.py and flatten_skills.py in mutating mode: both edited the
      # checkout and threw the result away, and fix_frontmatter.py collapsed every
      # folded `description: >-` block into the literal string ">-", which is how 26
      # skills shipped with a one-character description.
      - name: Rule F lifecycle remains fail-closed
        run: python3 scripts/validate-catalog-projections.py --self-test-rule-f
      - name: Catalog projections (manifest ↔ TOON ↔ README ↔ SKILL.md)
        run: python3 scripts/validate-catalog-projections.py
      - name: SKILL.md frontmatter is loadable by skill CLIs
        run: python3 scripts/repair-skill-frontmatter.py --check
      - name: Skill tree stays flat (no rewrite)
        run: python3 flatten_skills.py --dry-run
