name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install 'pyyaml==6.0.3'
      # CI validates, it never rewrites the catalog. The previous steps ran
      # fix_frontmatter.py and flatten_skills.py in mutating mode: both edited the
      # checkout and threw the result away, and fix_frontmatter.py collapsed every
      # folded `description: >-` block into the literal string ">-", which is how 26
      # skills shipped with a one-character description.
      - name: Rule F lifecycle remains fail-closed
        run: python3 scripts/validate-catalog-projections.py --self-test-rule-f
      - name: Catalog projections (manifest ↔ TOON ↔ README ↔ SKILL.md)
        run: python3 scripts/validate-catalog-projections.py
      - name: SKILL.md frontmatter is loadable by skill CLIs
        run: python3 scripts/repair-skill-frontmatter.py --check
      - name: Skill tree stays flat (no rewrite)
        run: python3 flatten_skills.py --dry-run

  installer:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Verify required runtime tools
        run: |
          node --version
          bun --version
          python3 --version
          jq --version
      - name: Resource regression dependencies
        run: pip install 'pyyaml==6.0.3' 'pillow==12.2.0'
      - name: Python resource and allocation regressions
        run: python3 scripts/test_performance_regressions.py -v
      - name: Node media resource regressions
        run: node --test .agent-skills/open-design-game-ui-concept/scripts/performance.test.mjs
      - name: Native Jev install, profile, and plugin regressions
        env:
          JEV_LIVE_SMOKE: '0'
          JEO_SKILL_STATE_DIR: ${{ runner.temp }}/jeo-skill-state
        run: node --test jev/install.test.mjs jev/plugin.test.mjs jev/profile.test.mjs jev/runtime.test.mjs jev/lifecycle.test.mjs jev/codex.test.mjs jev/usage-ledger.test.mjs
      - name: Isolated runtime configuration writer regressions
        run: /bin/bash scripts/test-runtime-config-writers.sh
      - name: Isolated runtime installation regressions
        run: python3 scripts/test_installer_regressions.py -v
      - name: Setup guide install-block regressions
        run: python3 scripts/test_setup_guide_regressions.py -v
      - name: Independent full-tools installation safety regressions
        run: python3 scripts/test_full_tools_independent.py -v
      - name: Optional Jev setup and backend contract regressions
        run: python3 scripts/test_jev_regressions.py -v
      - name: Optional Jevgrep discovery contract regressions
        run: python3 scripts/test_jevgrep_regressions.py -v
      - name: ECC read-only plan and proposal regressions
        run: |
          bash .agent-skills/ecc/scripts/ecc.sh self-test
          python3 -B scripts/test_ecc_regressions.py -v
      - name: Skill usage tracking, quarantine, and retirement regressions
        run: |
          python3 scripts/test_skill_usage_regressions.py -v
          python3 scripts/test_skill_quarantine_regressions.py -v
          python3 scripts/test_retire_unused_regressions.py -v
      - name: Isolated runtime loader probe regressions
        run: python3 scripts/test_runtime_skill_loader.py -v
      - name: Offline repository preflight regressions
        run: python3 scripts/test_repository_preflight_regressions.py -v
      - name: OpenCreator offline preflight regressions
        run: python3 -B scripts/test_opencreator_preflight.py -v
      - name: Lightpanda offline operator regressions
        run: python3 -B scripts/test_lightpanda_skill.py -v
      - name: Knowledge repository offline pin regressions
        run: python3 -B scripts/test_knowledge_repository_skills.py -v
      - name: Cross-engine game skill collection boundaries
        run: python3 -B scripts/test_awesome_gamedev_agent_skills.py -v
      - name: UI repository source and installation boundaries
        run: python3 -B scripts/test_ui_design_skills.py -v
