name: CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python fix_frontmatter.py
      - run: python flatten_skills.py

# --- A0-c' frontmatter exception ledger pin (program-scoped, REMOVED AT D4) ---
# The ledger's own sha256 is recorded HERE, outside the ledger file: a ledger
# that carries its own expected hash can be re-signed by whatever rewrote it,
# which defeats G11c. ci.yml is a review-required surface, so amending it is
# visible. Changing the ledger and this constant in one commit requires the
# trailer `Frontmatter-Exception-Ledger-Amendment:` plus an architect signature.
