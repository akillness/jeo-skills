<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="959" height="329" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
  </defs>
  <g font-size="14" fill="#1f2328">
    <!-- run -->
    <rect x="28" y="140" width="110" height="50" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="83" y="161" text-anchor="middle" font-weight="600">Run</text>
    <text x="83" y="179" text-anchor="middle" font-size="12" fill="#57606a">one workflow</text>
    <!-- builds -->
    <rect x="186" y="58" width="170" height="58" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="271" y="82" text-anchor="middle" font-weight="600">Build the APK</text>
    <text x="271" y="101" text-anchor="middle" font-size="12" fill="#57606a">Linux runner</text>
    <rect x="186" y="214" width="170" height="58" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="271" y="238" text-anchor="middle" font-weight="600">Build the iOS app</text>
    <text x="271" y="257" text-anchor="middle" font-size="12" fill="#57606a">macOS runner</text>
    <!-- agents (stacked cards) -->
    <rect x="420" y="40" width="210" height="64" rx="8" fill="#ffffff" stroke="#c4cbd3"/>
    <rect x="412" y="48" width="210" height="64" rx="8" fill="#ffffff" stroke="#c4cbd3"/>
    <rect x="404" y="56" width="210" height="64" rx="8" fill="#eef6f1" stroke="#2f6f4f" stroke-width="1.5"/>
    <text x="509" y="81" text-anchor="middle" font-weight="600">Android emulator</text>
    <text x="509" y="101" text-anchor="middle" font-size="12" fill="#57606a">+ 1 agent per persona</text>
    <rect x="420" y="196" width="210" height="64" rx="8" fill="#ffffff" stroke="#c4cbd3"/>
    <rect x="412" y="204" width="210" height="64" rx="8" fill="#ffffff" stroke="#c4cbd3"/>
    <rect x="404" y="212" width="210" height="64" rx="8" fill="#eef6f1" stroke="#2f6f4f" stroke-width="1.5"/>
    <text x="509" y="237" text-anchor="middle" font-weight="600">iOS Simulator</text>
    <text x="509" y="257" text-anchor="middle" font-size="12" fill="#57606a">+ 1 agent per persona</text>
    <!-- reports -->
    <rect x="682" y="138" width="120" height="54" rx="8" fill="#f6f8fa" stroke="#8c959f"/>
    <text x="742" y="161" text-anchor="middle" font-weight="600">Reports</text>
    <text x="742" y="179" text-anchor="middle" font-size="12" fill="#57606a">encrypted</text>
    <rect x="836" y="138" width="100" height="54" rx="8" fill="#1f2328"/>
    <text x="886" y="161" text-anchor="middle" font-weight="600" fill="#ffffff">SUMMARY</text>
    <text x="886" y="179" text-anchor="middle" font-size="12" fill="#d0d7de">your machine</text>
  </g>
  <g stroke="#57606a" stroke-width="1.5" fill="none" marker-end="url(#a)">
    <path d="M138 158 C160 158 160 87 184 87"/>
    <path d="M138 172 C160 172 160 243 184 243"/>
    <path d="M356 87 L400 88"/>
    <path d="M356 243 L400 244"/>
    <path d="M630 88 C656 88 656 158 680 158"/>
    <path d="M630 244 C656 244 656 172 680 172"/>
    <path d="M802 165 L833 165"/>
  </g>
  <text x="480" y="314" text-anchor="middle" font-size="12" fill="#57606a">Up to 20 phones at once on free GitHub runners. Each agent sees the screen, taps, types, and writes a report with screenshots.</text>
</svg>
