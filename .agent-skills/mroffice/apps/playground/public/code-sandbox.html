    <script>
      // Isolated JavaScript execution sandbox.
      //
      // Loaded in a sandbox="allow-scripts" iframe (opaque origin — no access to
      // app cookies/storage/DOM) and served with its OWN permissive CSP
      // (script-src 'unsafe-eval'; worker-src blob:) set by the middleware for
      // this path, so the app origin's CSP stays free of 'unsafe-eval'.
      //
      // Each request runs in a Worker (off the main thread, terminable) which
      // executes the code with new Function and captures console output.
      (function () {
        var MAX_OUTPUT_LINES = 2000;
        var MAX_OUTPUT_LINE_CHARS = 20000;
        var MAX_OUTPUT_LOG_CHARS = 300000;
        var MAX_OUTPUT_TEXT_CHARS = 50000;
        var FORMAT_MAX_ENTRIES = 100;
        var OUTPUT_TRUNCATION_MARKER =
          "… [output truncated: execution budget reached]";

        function truncateOutput(value, maxChars) {
          value = String(value);
          if (value.length <= maxChars) return value;
          if (maxChars <= OUTPUT_TRUNCATION_MARKER.length) {
            return OUTPUT_TRUNCATION_MARKER.slice(0, maxChars);
          }
          return (
            value.slice(0, maxChars - OUTPUT_TRUNCATION_MARKER.length) +
            OUTPUT_TRUNCATION_MARKER
          );
        }

        function createOutputCapture() {
          var logs = [];
          var logStreams = [];
          var chars = 0;
          var sealed = false;
          function marker() {
            if (sealed) return null;
            sealed = true;
            var remaining = MAX_OUTPUT_LOG_CHARS - chars;
            if (remaining <= 0 || logs.length >= MAX_OUTPUT_LINES) return null;
            var kept = OUTPUT_TRUNCATION_MARKER.slice(0, remaining);
            logs.push(kept);
            logStreams.push("stderr");
            chars += kept.length;
            return { text: kept, stream: "stderr" };
          }
          return {
            logs: logs,
            logStreams: logStreams,
            push: function (value, streamName) {
              if (sealed) return null;
              if (logs.length >= MAX_OUTPUT_LINES - 1) return marker();

              try {
                kept = truncateOutput(value, MAX_OUTPUT_LINE_CHARS);
              } catch (e) {
                kept = "<unprintable>";
              }
              var remaining =
                MAX_OUTPUT_LOG_CHARS - chars - OUTPUT_TRUNCATION_MARKER.length;

                if (remaining <= 0) return marker();
                kept = truncateOutput(kept, remaining);
                sealed = true;
              }
              var tag = streamName === "stderr" ? "stderr" : "stdout";
              logs.push(kept);
              logStreams.push(tag);
              chars += kept.length;
              return { text: kept, stream: tag };

            ? data.logStreams
            : null;
          for (var i = 0; i < rawLogs.length; i += 1) {
            if (
              output.push(
                rawLogs[i],
                rawStreams && rawStreams[i] === "stderr" ? "stderr" : "stdout",
              ) === null

              break;
            }

          var result = { logs: output.logs };
          if (rawStreams) result.logStreams = output.logStreams;
          if (typeof data.result === "string") {
            result.result = truncateOutput(data.result, MAX_OUTPUT_TEXT_CHARS);
          }
          if (typeof data.error === "string") {
            result.error = truncateOutput(data.error, MAX_OUTPUT_TEXT_CHARS);
          }

        // "stdout"|"stderr" for logs[i]): log/info/debug -> stdout, warn/error
        // -> stderr. `logs` stays a plain string[]; an absent tag renders as
        // stdout in the UI (backward-compatible). Errors are reported as
        // "name: message" so the renderer can parse the error type.
        // When stream:true, the worker also posts incremental {type:'stream'}
        // messages per console line (progressive output — Jupyter parity), which
        // the host relays to the parent tagged with the request id. The final
        // aggregate message (no `type`) still carries the complete logs.
        // The rest of a browser's / Node's console (table, group, count,
        // time, assert, dir, trace), the same logic as lib/code-runner/
        // js-runner.ts CONSOLE_EXTRAS_SRC; its source is embedded in the
        // worker below with toString(), so it must not use anything outside.

          var counts = Object.create(null);
          var timers = Object.create(null);

            var put = sink(stream);
            return function () {
              var args = Array.prototype.slice.call(arguments);
              if (!indent) return put.apply(null, args);

          ["log", "info", "debug"].forEach(function (name) { target[name] = write("stdout"); });

          target.dirxml = target.log;
          target.trace = function () {
            var args = Array.prototype.slice.call(arguments);
            target.error.apply(null, ["Trace:"].concat(args));
          };

            if (condition) return;
            var args = Array.prototype.slice.call(arguments, 1);

            var key = label === undefined ? "default" : String(label);

            var key = label === undefined ? "default" : String(label);

            var key = label === undefined ? "default" : String(label);

            if (arguments.length) target.log.apply(null, arguments);

          };

                row.value = display(item);
              }

            }

              return [String(row.index)].concat(
                columns.map(function (c) { return c in row.cells ? row.cells[c] : ""; }),
                hasValues ? [row.value === undefined ? "" : row.value] : []

            });
            var widths = header.map(function (h, c) {
              return body.reduce(function (w, r) { return Math.max(w, String(r[c]).length); }, String(h).length) + 2;
            });

              text = String(text);
              var left = Math.floor((width - text.length) / 2);
              return new Array(left + 1).join(" ") + text + new Array(width - text.length - left + 1).join(" ");
            }

            target.log(lines.join("\n"));
          };
          return target;
        }

        var JS_WORKER =
          "(function(){var NativePromise=Promise,nativeThen=Promise.prototype.then,nativeSetTimeout=setTimeout;" +
          // How many "eval at" a run's own Function frame carries in this
          // realm; a frame with more is code the prompt handed to eval.
          "var FUNCTION_FRAME_EVALS=(function(){try{var l=String(new Function('return new Error().stack')()).split('\\n');for(var i=0;i<l.length;i+=1){if(/<anonymous>:\\d+:\\d+\\)?\\s*$/.test(l[i]))return l[i].split('eval at ').length-1}}catch(ignored){}return 1})();" +

          "var MAX_OUTPUT_LINES=" +
          MAX_OUTPUT_LINES +
          ",MAX_OUTPUT_LINE_CHARS=" +
          MAX_OUTPUT_LINE_CHARS +
          ",MAX_OUTPUT_LOG_CHARS=" +
          MAX_OUTPUT_LOG_CHARS +
          ",MAX_OUTPUT_TEXT_CHARS=" +
          MAX_OUTPUT_TEXT_CHARS +
          ";" +
          "var FORMAT_MAX_ENTRIES=" +
          FORMAT_MAX_ENTRIES +
          ",FORMAT_MAX_NODES=512;" +
          "var OUTPUT_TRUNCATION_MARKER=" +
          JSON.stringify(OUTPUT_TRUNCATION_MARKER) +
          ";" +
          "function trunc(v,m){v=String(v);if(v.length<=m)return v;if(m<=OUTPUT_TRUNCATION_MARKER.length)return OUTPUT_TRUNCATION_MARKER.slice(0,m);return v.slice(0,m-OUTPUT_TRUNCATION_MARKER.length)+OUTPUT_TRUNCATION_MARKER}" +
          "function display(v,depth,budget){depth=depth||0;budget=budget||{nodes:0};budget.nodes+=1;if(budget.nodes>FORMAT_MAX_NODES)return'[output truncated]';if(typeof v==='string')return trunc(v,MAX_OUTPUT_LINE_CHARS);if(v===null||v===undefined||typeof v!=='object')return trunc(v,MAX_OUTPUT_LINE_CHARS);if(depth>6)return Array.isArray(v)?'[Array]':'[Object]';try{if(Array.isArray(v)){var a=[],al=Math.min(v.length,FORMAT_MAX_ENTRIES);for(var ai=0;ai<al;ai+=1)a.push(display(v[ai],depth+1,budget));if(v.length>al)a.push('[output truncated]');return'['+a.join(', ')+']'}if(v instanceof Map){var m=[],mi=v.entries(),ms,mc=0;while(mc<FORMAT_MAX_ENTRIES&&!(ms=mi.next()).done){m.push(display(ms.value[0],depth+1,budget)+' => '+display(ms.value[1],depth+1,budget));mc+=1}if(v.size>mc)m.push('[output truncated]');return'Map('+v.size+') {'+m.join(', ')+'}'}if(v instanceof Set){var s=[],si=v.values(),ss,sc=0;while(sc<FORMAT_MAX_ENTRIES&&!(ss=si.next()).done){s.push(display(ss.value,depth+1,budget));sc+=1}if(v.size>sc)s.push('[output truncated]');return'Set('+v.size+') {'+s.join(', ')+'}'}var p=[],pc=0;for(var k in v){if(!Object.prototype.hasOwnProperty.call(v,k))continue;if(pc>=FORMAT_MAX_ENTRIES){p.push('[output truncated]');break}p.push(k+': '+display(v[k],depth+1,budget));pc+=1}return'{'+p.join(', ')+'}'}catch(e){try{return trunc(Object.prototype.toString.call(v),MAX_OUTPUT_LINE_CHARS)}catch(ignored){return'<unprintable>'}}}" +

          "function sink(streamName){return function(){var args=[].slice.call(arguments);var line=args.map(display).join(' ');var kept=output.push(line, streamName);" +
          "if(stream&&kept)trustedPost({type:'stream',stream:kept.stream,chunk:kept.text+'\\n'})}}" +
          "var console={log:sink('stdout'),info:sink('stdout'),debug:sink('stdout')," +
          "warn:sink('stderr'),error:sink('stderr')};" +
          extendSandboxConsole.toString() +
          ";extendSandboxConsole(console,sink,function(v){return display(v)});" +
          // A console SESSION evaluates in the worker's global scope so what it
          // defines outlives the submission, and global scope cannot see the
          // local shim above - so publish the CURRENT run's shim globally too.
          // Rebinding per message is what keeps a session's second submission
          // from writing into the first one's (already reported) output.
          // Where it was thrown in the person's code ("at inner (<anonymous>:3:9)"),
          // as Python's traceback names its line: the output turns these into
          // jump-to-line links. Function adds three lines before the code; Safari
          // keeps no frames for it but says where it threw.

          "report(r)}" +

        function randomProtocolToken() {

          crypto.getRandomValues(bytes);
          return Array.prototype.map
            .call(bytes, function (value) {

            })
            .join("");
        }

        // Live console sessions, keyed by the host's session id. A session's
        // worker is NOT terminated when a submission finishes: its global scope
        // IS the session, and dropping it is what made the prompt forget the
        // previous line. Everything else (a file run) stays one worker per run,
        // terminated at the end, exactly as before.
        var sessions = Object.create(null);
        // One-shot file/cell workers are addressable by request id while they
        // run. Stop/timeout can therefore terminate exactly one worker instead
        // of remounting the page iframe and killing sibling views' executions.

        // session, but the sandbox cannot depend on that: a lost message or a
        // page that never unmounts cleanly would otherwise leave a worker
        // running forever. The oldest realm past the cap is retired instead.

        function touchSession(session) {
          var at = sessionOrder.indexOf(session);
          if (at !== -1) sessionOrder.splice(at, 1);
          sessionOrder.push(session);
          while (sessionOrder.length > MAX_LIVE_SESSIONS) {
            endSession(sessionOrder[0]);
          }

          var worker = sessions[session];
          if (!worker) return;
          delete sessions[session];
          var at = sessionOrder.indexOf(session);
          if (at !== -1) sessionOrder.splice(at, 1);
          try {
            worker.terminate();
          } catch (e) {
            /* already gone */
          }

        function endTransientRun(id) {
          var worker = transientRuns[id];
          if (!worker) return;
          delete transientRuns[id];
          try {
            worker.terminate();
          } catch (e) {
            /* already gone */
          }

            new Blob([source], { type: "application/javascript" }),

            if (!session && transientRuns[id] !== worker) return;

              !envelope ||
              typeof envelope !== "object" ||
              envelope.protocolToken !== protocolToken ||
              !envelope.payload ||
              typeof envelope.payload !== "object"

            if (data.type === "stream") {

                  {
                    id: id,

        // app's CSP: unisolated in development, and unable to evaluate anything
        // in production once 'unsafe-eval' was removed from the app because
        // execution had moved in here. It now runs where every other execution

              typeof envelope !== "object" ||
              envelope.protocolToken !== protocolToken ||

              return;
            }
            parent.postMessage({ id: id, debugMessage: envelope.payload }, "*");
          };
          worker.onerror = function (ev2) {
            parent.postMessage(
              {
                id: id,
                result: {
                  logs: [],
                  error: String((ev2 && ev2.message) || "worker error"),
                },
              },
              "*",
            );
            endDebug(id);
          };
          // The host mints the token, so it never travels through the app.
          var start = {};
          if (spec.start && typeof spec.start === "object") {
            for (var key in spec.start) {
              if (Object.prototype.hasOwnProperty.call(spec.start, key)) {
                start[key] = spec.start[key];
              }
            }
          }
          start.protocolToken = protocolToken;
          worker.postMessage(start);
        }

        window.addEventListener("message", function (ev) {
          // This iframe deliberately has an opaque origin, so an origin string
          // cannot identify the app. The browser-provided WindowProxy can: only
          // the actual embedding parent owns the authority to run, reset or
          // drive a debug session. A sibling/opener that merely found this
          // frame must not be able to spend its execution capability.
          if (ev.source !== window.parent) return;
          var req = ev.data;
          if (
            !req ||
            typeof req !== "object" ||
            typeof req.id !== "string" ||
            !req.id
          ) {
            return;
          }
          if (req.reset === true) {
            if (req.session) endSession(req.session);
            else if (typeof req.targetId === "string" && req.targetId) {
              endTransientRun(req.targetId);
            }
            parent.postMessage({ id: req.id, result: { logs: [] } }, "*");
            return;
          }
          if (req.debug) {
            startDebug(req.id, req.debug);
            return;
          }
          if (req.debugTerminate === true) {
            endDebug(req.id);
            return;
          }
          if (req.debugControl !== undefined) {
            var session = debugSessions[req.id];
            if (session) session.worker.postMessage(req.debugControl);
            return;
          }
          if (req.language === "javascript") {
            runJs(
              req.id,
              req.code || "",
              req.stream === true,
              typeof req.session === "string" && req.session ? req.session : null,
              req.prompt === "plain" || req.prompt === "await" ? req.prompt : null,
            );
          } else {
            parent.postMessage(
              {
                id: req.id,
                result: { logs: [], error: "Unsupported language in sandbox." },
              },
              "*",
            );
          }
        });
        parent.postMessage({ ready: true }, "*");
      })();
    </script>
