<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Ponytail ladder</title>
  <desc id="d">Take the first rung that fully works: 1 does it need to exist, 2 already in this codebase, 3 stdlib or platform feature, 4 installed dependency, 5 one readable line, 6 otherwise the minimum code that works. Never cut trust-boundary validation, data-loss handling, security, accessibility, hardware calibration, or anything the user asked for. Risky logic leaves one small test or assert. Every reply ends with what was skipped and any risk.</desc>
  <rect width="880" height="480" rx="16" fill="#F7F9F5"/>
  <text x="40" y="52" font-size="24" font-weight="700" fill="#12231E">Ponytail ladder</text>
  <text x="40" y="80" font-size="14" fill="#3D5A52">Take the first rung that fully solves the task. Adapted from Ponytail 5.3.3 (MIT).</text>
  <g font-size="15">
    <g transform="translate(40 104)">
      <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#DCE4DE"/>
      <circle cx="24" cy="22" r="13" fill="#137E73"/><text x="24" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">1</text>
      <text x="48" y="19" font-weight="700" fill="#12231E">Does it need to exist?</text>
      <text x="48" y="36" font-size="13" fill="#3D5A52">No: skip it and name it in one line</text>
    </g>
    <g transform="translate(40 156)">
      <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#DCE4DE"/>
      <circle cx="24" cy="22" r="13" fill="#137E73"/><text x="24" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">2</text>
      <text x="48" y="19" font-weight="700" fill="#12231E">Already in this codebase?</text>
      <text x="48" y="36" font-size="13" fill="#3D5A52">Reuse the helper, component or pattern as the code around it does</text>
    </g>
    <g transform="translate(40 208)">
      <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#DCE4DE"/>
      <circle cx="24" cy="22" r="13" fill="#137E73"/><text x="24" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">3</text>
      <text x="48" y="19" font-weight="700" fill="#12231E">Standard library or platform feature?</text>
      <text x="48" y="36" font-size="13" fill="#3D5A52">Use it, unless the project has its own</text>
    </g>
    <g transform="translate(40 260)">
      <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#DCE4DE"/>
      <circle cx="24" cy="22" r="13" fill="#137E73"/><text x="24" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">4</text>
      <text x="48" y="19" font-weight="700" fill="#12231E">Installed dependency?</text>
      <text x="48" y="36" font-size="13" fill="#3D5A52">Use it; never add a dependency for a few lines</text>
    </g>
    <g transform="translate(40 312)">
      <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#DCE4DE"/>
      <circle cx="24" cy="22" r="13" fill="#137E73"/><text x="24" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">5</text>
      <text x="48" y="19" font-weight="700" fill="#12231E">One line a reader gets at a glance?</text>
      <text x="48" y="36" font-size="13" fill="#3D5A52">Write the one line</text>
    </g>
    <g transform="translate(40 364)">
      <rect width="520" height="44" rx="10" fill="#FFFFFF" stroke="#DCE4DE"/>
      <circle cx="24" cy="22" r="13" fill="#137E73"/><text x="24" y="27" text-anchor="middle" font-size="14" font-weight="700" fill="#FFFFFF">6</text>
      <text x="48" y="19" font-weight="700" fill="#12231E">Otherwise</text>
      <text x="48" y="36" font-size="13" fill="#3D5A52">The minimum code that works, finished at every caller</text>
    </g>
  </g>
  <g transform="translate(590 104)">
    <rect width="250" height="196" rx="10" fill="#FFFFFF" stroke="#AC6415" stroke-width="1.5"/>
    <text x="18" y="28" font-size="15" font-weight="700" fill="#AC6415">Never cut</text>
    <g font-size="13" fill="#12231E">
      <text x="18" y="54">• trust-boundary validation</text>
      <text x="18" y="76">• data-loss handling</text>
      <text x="18" y="98">• security</text>
      <text x="18" y="120">• accessibility</text>
      <text x="18" y="142">• hardware calibration</text>
      <text x="18" y="164">• anything the user asked for</text>
    </g>
  </g>
  <g transform="translate(590 312)">
    <rect width="250" height="100" rx="10" fill="#FFFFFF" stroke="#137E73" stroke-width="1.5"/>
    <text x="18" y="28" font-size="15" font-weight="700" fill="#137E73">Leave a check</text>
    <g font-size="13" fill="#12231E">
      <text x="18" y="52">A branch, loop, parser, money or</text>
      <text x="18" y="72">security code: one small test</text>
      <text x="18" y="90">or assert</text>
    </g>
  </g>
  <text x="40" y="450" font-size="13" fill="#12231E">Mark known limits with <tspan font-family="Menlo, Consolas, monospace" fill="#137E73">shortcut: &lt;limit&gt;, &lt;when to upgrade&gt;</tspan> and end every reply with what was skipped and any risk.</text>
</svg>
